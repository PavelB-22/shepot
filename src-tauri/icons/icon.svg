<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A4"/>
      <stop offset="1" stop-color="#0B7A8F"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3F7F3"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#053A44" flood-opacity="0.35"/>
    </filter>
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#appShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <!-- звуковые волны -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-opacity="0.55" stroke-width="30">
    <path d="M 300 400 Q 260 470 300 540"/>
    <path d="M 230 350 Q 165 470 230 590"/>
    <path d="M 724 400 Q 764 470 724 540"/>
    <path d="M 794 350 Q 859 470 794 590"/>
  </g>
  <!-- микрофон -->
  <g filter="url(#sh)">
    <rect x="417" y="240" width="190" height="330" rx="95" fill="url(#mic)"/>
  </g>
  <path d="M 357 470 Q 357 650 512 650 Q 667 650 667 470" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <line x1="512" y1="650" x2="512" y2="740" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <line x1="432" y1="752" x2="592" y2="752" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <!-- полоски на микрофоне -->
  <g stroke="#0B7A8F" stroke-opacity="0.25" stroke-width="14" stroke-linecap="round">
    <line x1="470" y1="330" x2="554" y2="330"/>
    <line x1="470" y1="380" x2="554" y2="380"/>
    <line x1="470" y1="430" x2="554" y2="430"/>
  </g>
</svg>
