# Автосборка Shepot для Mac и Windows.
# Запускается, когда в репозиторий отправлен тег вида v0.1.0.
# Готовые установщики и файл обновлений (latest.json) появляются на странице Releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Mac на Apple Silicon (M1/M2/M3/M4)
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: windows-latest    # Windows 10/11
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Mac: загружаем наш постоянный сертификат подписи.
      # Тогда macOS считает каждую новую версию «той же программой» и не сбрасывает разрешения.
      - name: Import signing certificate (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "::error::Нет секрета MACOS_CERT_P12"; exit 1; fi
          printf "%s" "$CERT_P12" | tr -d ' \r\n\t' | base64 --decode > cert.p12
          KC=signing.keychain-db
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import cert.p12 -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC"
          # доверяем сертификату на этой машине сборки, чтобы codesign его принял
          security find-certificate -c "Shepot Self-Signed" -p "$KC" > cert.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem
          rm -f cert.p12 cert.pem
          security find-identity -v -p codesigning

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ключ подписи обновлений — секрет в настройках репозитория
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # Mac: подписывать нашим сертификатом (на Windows пусто — не используется)
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && 'Shepot Self-Signed' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Shepot ${{ github.ref_name }}'
          releaseBody: |
            **Установка одной строкой (дальше программа обновляется сама):**

            🍏 **Mac** — открой Терминал и вставь:
            `curl -fsSL https://raw.githubusercontent.com/PavelB-22/shepot/main/install.sh | bash`

            🪟 **Windows** — открой PowerShell и вставь:
            `irm https://raw.githubusercontent.com/PavelB-22/shepot/main/install.ps1 | iex`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
